name: Native E2E baseline reproduction
on:
  push:
    branches: [validation/native-baseline-20261111]
permissions:
  contents: read
jobs:
  native-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - name: Install Chrome
        run: cargo run --manifest-path cli/Cargo.toml -- install --with-deps
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Obscura
        run: |
          mkdir -p "$RUNNER_TEMP/obscura"
          curl -fsSL https://github.com/h4ckf0r0day/obscura/releases/download/v0.2.4/obscura-x86_64-linux.tar.gz | tar xz -C "$RUNNER_TEMP/obscura"
          echo "OBSCURA_BIN=$RUNNER_TEMP/obscura/obscura" >> "$GITHUB_ENV"
      - name: Cross-origin frame baseline
        run: cargo test --profile ci --manifest-path cli/Cargo.toml e2e_domain_filter_navigates_page_with_cross_origin_iframes -- --ignored --test-threads=1
      - name: Flow replay baseline
        if: success() || failure()
        run: cargo test --profile ci --manifest-path cli/Cargo.toml e2e_flow_replay_runs_once_per_run -- --ignored --test-threads=1
      - name: WebMCP baseline
        if: success() || failure()
        run: cargo test --profile ci --manifest-path cli/Cargo.toml e2e_webmcp -- --ignored --test-threads=1
