name: Windows baseline validation
on:
  push:
    branches: [validation/windows-baseline-20261111]
jobs:
  windows-baseline:
    name: Unmodified main Windows tests
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - name: Run Rust tests
        run: cargo test --profile ci --manifest-path cli/Cargo.toml --target x86_64-pc-windows-msvc
